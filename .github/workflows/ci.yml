name: CI
on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches:
    - '**'
    tags:
    - "!*"
    paths-ignore:
    - '**.md'

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - name: Npm ci
      run: npm ci

    - name: Running the tests
      run: npm run test

    - name: Stop WordPress environment
      if: always()
      run: npm run stop
